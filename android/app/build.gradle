import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def pkgFile = file("../../package.json")
def pkgVersion = "0.13.49"
def computedVersionCode = 1349
if (pkgFile.exists()) {
    def pkg = new JsonSlurper().parse(pkgFile)
    if (pkg.version) {
        pkgVersion = pkg.version.toString()
        def parts = pkgVersion.tokenize('.')
        if (parts.size() >= 3) {
            computedVersionCode = (parts[0].toInteger() * 100000) + (parts[1].toInteger() * 1000) + parts[2].replaceAll("[^0-9]", "").toInteger()
            if (computedVersionCode <= 0) computedVersionCode = 1
        }
    }
}

android {
    namespace 'app.esenho'
    compileSdk 34

    defaultConfig {
        applicationId "app.esenho"
        minSdk 26
        targetSdk 34
        versionCode computedVersionCode
        versionName pkgVersion
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            def defaultKs = file("../keystore/release.keystore")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "esenho123"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "esenho"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "esenho123"
            } else if (defaultKs.exists()) {
                storeFile defaultKs
                storePassword "esenho123"
                keyAlias "esenho"
                keyPassword "esenho123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    ndkVersion '26.1.10909125'

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress += ['wasm', 'json', 'esen', 'svg', 'wav', 'webmanifest']
    }
}

tasks.register('syncWebAssets', Sync) {
    def repoRoot = rootProject.projectDir.parentFile
    from(repoRoot) {
        include 'index.html'
        include 'painter.html'
        include 'studio.html'
        include 'manifest.webmanifest'
        include 'icon.svg'
        include 'icon-studio.svg'
        include 'data.json'
        include 'sw.js'
        include 'vendor/**'
        include 'plugins/**'
        include 'src/**/*.js'
        include 'src/**/*.mjs'
        include 'src/**/*.css'
        include 'src/**/*.json'
    }
    into layout.projectDirectory.dir("src/main/assets")
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
}

