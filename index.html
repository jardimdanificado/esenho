<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesenho — New Canvas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23282828'/><circle cx='16' cy='16' r='10' fill='%23fabd2f'/><circle cx='16' cy='16' r='5' fill='%23fb4934'/></svg>">
  <style>
    :root {
      --bg-dark: #1d2021;
      --bg-card: #282828;
      --bg-input: #3c3836;
      --border: #504945;
      --text: #ebdbb2;
      --text-muted: #a89984;
      --accent: #458588;
      --accent-hover: #83a598;
      --primary: #fabd2f;
      --primary-hover: #fe8019;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .brand p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .dimensions-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .times-symbol {
      color: var(--text-muted);
      font-weight: bold;
      font-size: 16px;
      padding-top: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="number"]:focus {
      border-color: var(--accent-hover);
      box-shadow: 0 0 0 3px rgba(131, 165, 152, 0.2);
    }

    .presets-label {
      margin-bottom: 8px;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 24px;
    }

    .btn-preset {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      padding: 7px 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      user-select: none;
    }

    .btn-preset:hover, .btn-preset.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-hover);
    }

    .btn-start {
      width: 100%;
      background: var(--primary);
      color: #1d2021;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-start:hover {
      background: var(--primary-hover);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Wesenho</h1>
      <p>Pixel Engine &amp; Digital Painting Studio</p>
    </div>

    <form id="canvas-form" action="app.html" method="GET">
      <div class="dimensions-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="inp-w">Largura (W)</label>
          <input type="number" id="inp-w" name="w" value="1280" min="64" max="8192" required>
        </div>
        <div class="times-symbol">×</div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="inp-h">Altura (H)</label>
          <input type="number" id="inp-h" name="h" value="720" min="64" max="8192" required>
        </div>
      </div>

      <div class="form-group">
        <label class="presets-label">Resoluções Rápidas</label>
        <div class="presets-grid">
          <button type="button" class="btn-preset active" data-w="1280" data-h="720">1280 × 720</button>
          <button type="button" class="btn-preset" data-w="1920" data-h="1080">1920 × 1080</button>
          <button type="button" class="btn-preset" data-w="800" data-h="600">800 × 600</button>
          <button type="button" class="btn-preset" data-w="1024" data-h="1024">1024 × 1024</button>
          <button type="button" class="btn-preset" data-w="720" data-h="1280">720 × 1280</button>
          <button type="button" class="btn-preset" data-w="640" data-h="480">640 × 480</button>
        </div>
      </div>

      <button type="submit" class="btn-start" id="btn-start">
        Começar a Pintar
      </button>

      <p class="hint">Padrão: 1280 × 720 pixels caso não preenchido</p>
    </form>
  </div>

  <script>
    const inpW = document.getElementById('inp-w');
    const inpH = document.getElementById('inp-h');
    const presets = document.querySelectorAll('.btn-preset');
    const form = document.getElementById('canvas-form');

    function updateActivePreset() {
      const w = parseInt(inpW.value, 10);
      const h = parseInt(inpH.value, 10);
      presets.forEach(p => {
        const pw = parseInt(p.dataset.w, 10);
        const ph = parseInt(p.dataset.h, 10);
        if (pw === w && ph === h) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
    }

    presets.forEach(btn => {
      btn.addEventListener('click', () => {
        inpW.value = btn.dataset.w;
        inpH.value = btn.dataset.h;
        updateActivePreset();
      });
    });

    inpW.addEventListener('input', updateActivePreset);
    inpH.addEventListener('input', updateActivePreset);

    form.addEventListener('submit', (e) => {
      if (!inpW.value || parseInt(inpW.value, 10) <= 0) inpW.value = 1280;
      if (!inpH.value || parseInt(inpH.value, 10) <= 0) inpH.value = 720;
    });
  </script>
</body>
</html>
