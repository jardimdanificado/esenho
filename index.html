<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>wesenho</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1d2021; color: #ebdbb2;
      font: 13px/1.4 'JetBrains Mono', 'Fira Code', monospace; overflow: hidden; }

    #layout { display: flex; height: 100vh; }

    /* ── Canvas area ── */
    #cvswrap { flex: 1; position: relative; overflow: hidden; background: #1d2021; min-width: 0; min-height: 0; }
    #wcanvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

    /* ── Panel (REPL + status) - Gruvbox Dark ── */
    #panel {
      position: relative;
      width: 320px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #3c3836;
      background: #1d2021;
      flex-shrink: 0;
    }

    #wterm {
      flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 12px; line-height: 1.5;
      scrollbar-width: thin; scrollbar-color: #504945 #1d2021; color: #ebdbb2;
    }
    #wterm div        { white-space: pre-wrap; word-break: break-word; }
    #wterm div.err    { color: #fb4934; } /* Gruvbox bright red */
    #wterm div.ok     { color: #b8bb26; } /* Gruvbox bright green */
    #wterm div.cmd    { color: #83a598; } /* Gruvbox bright blue */

    #inputrow {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-top: 1px solid #3c3836; background: #282828;
    }
    #inputrow span { color: #fabd2f; font-weight: bold; flex-shrink: 0; } /* Gruvbox yellow */
    #wcmd {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fbf1c7; font: inherit; caret-color: #fe8019; /* Gruvbox orange */
    }

    #wstatus {
      padding: 5px 10px; font-size: 11px; color: #a89984;
      border-top: 1px solid #3c3836; background: #1d2021;
    }

    /* Console "Orelha" (tab / pull-tab on panel edge) */
    #toggle-panel {
      position: absolute;
      top: 14px;
      left: 1px;
      transform: translateX(-100%);
      z-index: 20;
      background: #282828;
      color: #ebdbb2;
      border: 1px solid #504945;
      border-right: 1px solid #282828;
      border-radius: 0;
      padding: 5px 9px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.4);
    }
    #toggle-panel:hover {
      background: #3c3836;
      color: #fabd2f;
      border-color: #7c6f64;
    }
    #panel.hidden {
      width: 0 !important;
      border-left: none !important;
    }
    #panel.hidden > *:not(#toggle-panel) {
      display: none !important;
    }
    #panel.hidden #toggle-panel {
      left: 0;
      border-right: none;
    }

    /* ── Vertical / narrow screens: panel below canvas ── */
    @media (max-aspect-ratio: 3/4) {
      #layout { flex-direction: column; }
      #panel  { width: 100%; height: 38vh; border-left: none; border-top: 1px solid #3c3836; }
      #panel.hidden {
        width: 100% !important;
        height: 0 !important;
        border-top: none !important;
      }
      #toggle-panel {
        top: 1px;
        left: auto;
        right: 14px;
        transform: translateY(-100%);
        border: 1px solid #504945;
        border-bottom: 1px solid #282828;
        border-right: 1px solid #504945;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.4);
      }
      #panel.hidden #toggle-panel {
        top: 0;
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
<div id="layout">
  <div id="cvswrap">
    <canvas id="wcanvas"></canvas>
  </div>
  <div id="panel">
    <button id="toggle-panel" type="button" title="Toggle Console (Ctrl+`)">console [hide] &#x25B6;</button>
    <div id="wterm"></div>
    <div id="inputrow">
      <span>wesenho&gt;</span>
      <input id="wcmd" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="type a command…" autofocus>
    </div>
    <div id="wstatus">loading…</div>
  </div>
</div>
<script type="module">
  import { papagaio } from "./src/papagaio/index.js";
  globalThis.papagaio = papagaio;
</script>
<script src="src/wesenho.js"></script>
<script src="src/host-browser.js"></script>
</body>
</html>
