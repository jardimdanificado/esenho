<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>wesenho</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; color: #ddd;
      font: 13px/1.4 'JetBrains Mono', 'Fira Code', monospace; overflow: hidden; }

    #layout { display: flex; height: 100vh; }

    /* ── Canvas area ── */
    #cvswrap { flex: 1; position: relative; overflow: hidden; background: #181818; min-width: 0; min-height: 0; }
    #wcanvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

    /* ── Panel (REPL + status) ── */
    #panel { width: 300px; display: flex; flex-direction: column;
      border-left: 1px solid #333; background: #141414; }

    #wterm {
      flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 12px; line-height: 1.5;
      scrollbar-width: thin; scrollbar-color: #444 #1a1a1a;
    }
    #wterm div        { white-space: pre-wrap; word-break: break-word; }
    #wterm div.err    { color: #ff5555; }
    #wterm div.ok     { color: #50fa7b; }
    #wterm div.cmd    { color: #8be9fd; }

    #inputrow {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-top: 1px solid #333; background: #181818;
    }
    #inputrow span { color: #50fa7b; font-weight: bold; flex-shrink: 0; }
    #wcmd {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f8f8f2; font: inherit; caret-color: #bd93f9;
    }

    #wstatus {
      padding: 4px 10px; font-size: 11px; color: #666;
      border-top: 1px solid #2a2a2a; background: #111;
    }

    /* ── Vertical / narrow screens: panel below canvas ── */
    @media (max-aspect-ratio: 3/4) {
      #layout { flex-direction: column; }
      #panel  { width: 100%; height: 38vh; border-left: none; border-top: 1px solid #333; }
    }
  </style>
</head>
<body>
<div id="layout">
  <div id="cvswrap">
    <canvas id="wcanvas"></canvas>
  </div>
  <div id="panel">
    <div id="wterm"></div>
    <div id="inputrow">
      <span>wesenho&gt;</span>
      <input id="wcmd" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="type a command…" autofocus>
    </div>
    <div id="wstatus">loading…</div>
  </div>
</div>
<script src="src/wesenho.js"></script>
<script src="src/host-browser.js"></script>
</body>
</html>
