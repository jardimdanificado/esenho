name: Build Android APK and Linux

on:
  push:
    branches: ["master", "main", "development"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main", "development"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "android/keystore/release.keystore" ]; then
            echo "Using committed repository keystore for deterministic APK signature."
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/keystore/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=esenho123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=esenho" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=esenho123" >> $GITHUB_ENV
          fi

      - name: Build Signed APK
        run: |
          gradle -p android assembleRelease --no-daemon
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "esenho-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esenho-v${{ env.APK_VERSION }}-apk
          path: esenho-v${{ env.APK_VERSION }}.apk
          if-no-files-found: error

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake libx11-dev libxi-dev ffmpeg

      - name: Test Linux Desktop
        run: ./desktop/test.sh

      - name: Build Linux Package with Bundled Java
        run: |
          make linux
          cp desktop/build/Esenho-linux.tar.gz "esenho-v${APK_VERSION}-linux-x86_64.tar.gz"

      - name: Test Packaged Linux Executable
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          TEST_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/esenho-linux-test.XXXXXX")
          XDG_DATA_HOME="$TEST_DATA_DIR/data" XDG_CACHE_HOME="$TEST_DATA_DIR/cache" \
            desktop/build/package/Esenho/bin/Esenho --smoke-test

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esenho-v${{ env.APK_VERSION }}-linux-x86_64
          path: esenho-v${{ env.APK_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            "esenho-v${APK_VERSION}.apk"
            "esenho-v${APK_VERSION}-linux-x86_64.tar.gz"
          )
          if gh release view "v${APK_VERSION}" >/dev/null 2>&1; then
            gh release edit "v${APK_VERSION}" --title "v${APK_VERSION}"
            gh release upload "v${APK_VERSION}" "${assets[@]}" --clobber
          else
            gh release create "v${APK_VERSION}" "${assets[@]}" \
              --title "v${APK_VERSION}" \
              --notes "Release v${APK_VERSION}"
          fi




