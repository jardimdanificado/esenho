name: Build Offline Android APK

on:
  push:
    branches: ["master", "main", "development"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main", "development"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile WebAssembly Core & Plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          make all

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "android/keystore/release.keystore" ]; then
            echo "Using committed repository keystore for deterministic APK signature."
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/keystore/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=esenho123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=esenho" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=esenho123" >> $GITHUB_ENV
          fi

      - name: Build Signed APK
        run: |
          gradle -p android assembleRelease --no-daemon
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "esenho-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esenho-v${{ env.APK_VERSION }}-apk
          path: esenho-v${{ env.APK_VERSION }}.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${APK_VERSION}" >/dev/null 2>&1; then
            for asset in $(gh release view "v${APK_VERSION}" --json assets -q '.assets[].name'); do
              if [ "$asset" != "esenho-v${APK_VERSION}.apk" ]; then
                gh release delete-asset "v${APK_VERSION}" "$asset" -y || true
              fi
            done
            gh release edit "v${APK_VERSION}" --title "v${APK_VERSION}"
            gh release upload "v${APK_VERSION}" "esenho-v${APK_VERSION}.apk" --clobber
          else
            gh release create "v${APK_VERSION}" "esenho-v${APK_VERSION}.apk" \
              --title "v${APK_VERSION}" \
              --notes "Release v${APK_VERSION}"
          fi




