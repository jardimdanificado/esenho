name: Build Offline Android APK

on:
  push:
    branches: ["master", "main", "new"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main", "new"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile WebAssembly Core & Plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          make all

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/ci-release.keystore" \
              -alias esenho \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass esenho123 \
              -keypass esenho123 \
              -dname "CN=Esenho, OU=Studio, O=Esenho, L=Unknown, S=Unknown, C=BR"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=esenho123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=esenho" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=esenho123" >> $GITHUB_ENV
          fi

      - name: Build Signed Offline APK
        run: |
          gradle -p android assembleRelease --no-daemon
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "esenho-v${VERSION}-offline.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "esenho-offline.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esenho-v${{ env.APK_VERSION }}-offline-apk
          path: esenho-v${{ env.APK_VERSION }}-offline.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APK_VERSION }}
          name: Esenho v${{ env.APK_VERSION }}
          files: |
            esenho-v${{ env.APK_VERSION }}-offline.apk
            esenho-offline.apk

